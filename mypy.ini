[mypy]
python_version = 3.14
strict = true
show_error_codes = true
warn_unused_ignores = true
files = ocdcircuit, apps, tools, benches, tests/test_all.py, tests/test_snapshot.py, tests/test_studio.py, tests/test_paper.py, tests/test_sdk.py, tests/test_exact_overlap.py

# optional third-party imports (graceful fallbacks in code): missing
# stubs must not fail the gate on machines without them installed
[mypy-numpy.*]
ignore_missing_imports = true
[mypy-rich.*]
ignore_missing_imports = true
[mypy-PIL.*]
ignore_missing_imports = true
