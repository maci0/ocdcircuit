name: check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {SOURCE_DATE_EPOCH: "0", LC_ALL: C, TZ: UTC}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
        # pinned, so the gate cannot change under us between runs; bump the pin
        # in requirements-dev.txt deliberately after a local `mypy` / `ruff check`
        # pass
      - run: python -m pip install '.[optional]'
        # goldens / SIMD placer expect numpy; without it `make test` drifts
        # from the committed snapshots (same extras `make setup` installs).
        # non-editable here: CI does not edit the tree after install.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
        # ubuntu-24.04 runners already ship Google Chrome (+ Chromium); the
        # studio gate finds them via google-chrome / chromium. Do not apt-install
        # chromium-browser — on noble it is a snap shim and flakes on the store.
        # poppler-utils = pdftotext, so the kb/ datasheet-PDF path runs here
        # instead of being skipped.
      - run: make check
