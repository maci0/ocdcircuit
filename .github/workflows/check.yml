name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version-file: ".python-version"}
      - run: python -m pip install -r requirements-dev.txt
        # pinned, so the gate cannot change under us between runs; bump the pin
        # in requirements-dev.txt deliberately after a local `mypy` / `ruff check`
        # pass
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser poppler-utils
        # studio gate skips its browser half when no chromium is found;
        # the apt line keeps the full gate (screenshot + console-clean) live.
        # poppler-utils = pdftotext, so the kb/ datasheet-PDF path runs here
        # instead of being skipped.
      - run: make check
